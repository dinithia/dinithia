openapi: 3.1.0
info:
  title: Rudder Platform User Management API
  version: 0.1.0
  description: Users, organizations, memberships, and invites.
servers:
  - url: /api/platform/v1
paths:
  /users/me:
    get:
      operationId: getCurrentUser
      summary: Get the authenticated user profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /orgs/{org_id}/users:
    get:
      operationId: listOrgUsers
      summary: List users in an organization
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: Membership list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Membership"
    post:
      operationId: inviteUser
      summary: Invite a user to the organization
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteRequest"
      responses:
        "201":
          description: Invite created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
  /orgs/{org_id}/memberships/{membership_id}:
    patch:
      operationId: updateMembership
      summary: Update membership roles or status
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - name: membership_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembershipUpdate"
      responses:
        "200":
          description: Updated membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
  /orgs:
    post:
      operationId: createOrganization
      summary: Create an organization
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name:
                  type: string
                slug:
                  type: string
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    OrgId:
      name: org_id
      in: path
      required: true
      schema:
        type: string
  schemas:
    User:
      type: object
      required: [id, email, status, created_at]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        email_verified:
          type: boolean
        display_name:
          type: string
        avatar_url:
          type: string
          format: uri
        status:
          type: string
          enum: [invited, active, suspended, deactivated, deleted]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Organization:
      type: object
      required: [id, name, slug, status, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        status:
          type: string
          enum: [active, suspended, deleted]
        created_at:
          type: string
          format: date-time
    Membership:
      type: object
      required: [id, user_id, org_id, roles, status, created_at]
      properties:
        id:
          type: string
        user_id:
          type: string
        org_id:
          type: string
        roles:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [invited, active, suspended, removed]
        created_at:
          type: string
          format: date-time
    MembershipUpdate:
      type: object
      properties:
        roles:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [active, suspended, removed]
    InviteRequest:
      type: object
      required: [email, roles]
      properties:
        email:
          type: string
          format: email
        roles:
          type: array
          minItems: 1
          items:
            type: string
    Invite:
      type: object
      required: [id, email, org_id, roles, expires_at]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        org_id:
          type: string
        roles:
          type: array
          items:
            type: string
        expires_at:
          type: string
          format: date-time
