openapi: 3.1.0
info:
  title: Rudder Platform Authorization API
  version: 0.1.0
  description: Role and permission management for the Rudder platform.
servers:
  - url: /api/platform/v1/authz
paths:
  /roles:
    get:
      operationId: listRoles
      summary: List roles available in the active organization
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Role list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Role"
  /permissions:
    get:
      operationId: listPermissions
      summary: List the canonical permission catalog
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Permission catalog
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Permission"
  /check:
    post:
      operationId: checkAccess
      summary: Evaluate whether the subject may perform an action on a resource
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessCheckRequest"
      responses:
        "200":
          description: Decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessCheckResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Role:
      type: object
      required: [id, name, permissions]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        system:
          type: boolean
        permissions:
          type: array
          items:
            type: string
    Permission:
      type: object
      required: [id, action, resource_type, description]
      properties:
        id:
          type: string
        action:
          type: string
        resource_type:
          type: string
        description:
          type: string
    AccessCheckRequest:
      type: object
      required: [action, resource]
      properties:
        action:
          type: string
          description: Permission id, e.g. users:invite
        resource:
          type: object
          required: [type, id, org_id]
          properties:
            type:
              type: string
            id:
              type: string
            org_id:
              type: string
            owner_id:
              type: string
    AccessCheckResponse:
      type: object
      required: [allow]
      properties:
        allow:
          type: boolean
        reason:
          type: string
