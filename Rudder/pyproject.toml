[project]
name = "rudder"
version = "0.0.0"
description = "Rudder monorepo — Python workspace for services, agents, data, and tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
  "mypy>=1.13",
]

# Add workspace members as Python packages are introduced, e.g.:
# [tool.uv.workspace]
# members = ["services/*", "agents/*", "packages/*", "tools/*"]


[tool.ruff]
target-version = "py312"
line-length = 100
src = ["services", "agents", "packages", "data", "tools", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true
packages = []
