# OIDC identity provider configuration (template).
# Copy per environment and bind secrets via platform/security.

version: 1
providers:
  - id: primary
    type: oidc
    enabled: true
    issuer: https://auth.example.com/
    client_id: ${OIDC_CLIENT_ID}
    client_secret_ref: secret://platform/authentication/oidc/client-secret
    scopes:
      - openid
      - profile
      - email
      - offline_access
    claims_mapping:
      sub: sub
      email: email
      email_verified: email_verified
      name: name
      picture: picture
    audiences:
      - rudder-api
      - rudder-web
    jwks_uri: https://auth.example.com/.well-known/jwks.json
    token_endpoint_auth_method: client_secret_post

  - id: local-bootstrap
    type: local
    enabled: true
    description: Break-glass local accounts for bootstrap and emergency access
    allowed_roles:
      - owner
      - admin
