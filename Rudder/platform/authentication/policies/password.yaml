# Local-provider password policy (OIDC-federated users are exempt).

version: 1
min_length: 12
max_length: 128
require:
  uppercase: true
  lowercase: true
  digit: true
  symbol: true
disallow:
  common_passwords: true
  reuse_last_n: 5
  contains_username: true
hashing:
  algorithm: argon2id
  memory_kib: 65536
  iterations: 3
  parallelism: 4
lockout:
  max_failed_attempts: 5
  window_seconds: 900
  lockout_seconds: 900
